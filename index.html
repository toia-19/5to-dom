<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Vinculamos a CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor 1: TABLA -->
    <div id="contenedor"></div>

    <!-- Formulario para crear nueva TARJETA -->
    <h1>CRUD de Tarjetas: Create, Read, Update, Delete</h1>
    <form id="formularioTarjeta">
        <h2>Nueva Tarjeta</h2>
        <input id="titulo" type="text" placeholder="Ingrese un título">
        <input id="descripcion" type="text" placeholder="Ingrese una descripción">
        <input id="anio" type="number" placeholder="Ingrese un año válido">

        <p id="mensaje"></p>
        <button type="submit">Crear tarjeta</button>
    </form>

    <!-- Contenedor 2 + botón: TARJETAS -->
    <button id="agregar">Agregar nueva tarjeta</button>
    <div id="contenedor2"></div>

    <!-- Vinculamos a JS -->
    <script src="main.js"></script>
</body>
</html>
